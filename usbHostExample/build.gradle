plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'info.marcin.usbhost.example'
    compileSdk 37

    defaultConfig {
        applicationId 'info.marcin.usbhost.example'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName providers.gradleProperty('VERSION_NAME').get()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':usbHostForAndroid')

    def composeBom = platform("androidx.compose:compose-bom:${providers.gradleProperty('COMPOSE_BOM_VERSION').get()}")
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}
