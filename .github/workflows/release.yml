name: Release 0.1.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the release without publishing
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify immutable release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'platforms;android-37' 'build-tools;37.0.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          test "$version" = '0.1.0'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${version}"
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify policy, tests and publication bundle
        shell: pwsh
        run: ./scripts/verify-release.ps1 -ExpectedVersion 0.1.0

      - run: ./gradlew --no-daemon test lint assembleRelease :usbHostForAndroid:verifyReleasePublication
      - run: ./gradlew --no-daemon -p smoke-tests/android-consumer :consumer:assembleDebug

      - name: Run native contracts
        run: |
          cmake -S native-tests -B build/native-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-tests --parallel 2
          ctest --test-dir build/native-tests --output-on-failure

      - name: Upload verified candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          retention-days: 30
          path: |
            usbHostForAndroid/build/outputs/aar/*.aar
            usbHostForAndroid/build/repository/**
            usbHostExample/build/outputs/apk/release/*.apk

  publish:
    name: Sign and publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'platforms;android-37' 'build-tools;37.0.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Require all protected secrets
        shell: bash
        run: |
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
      - name: Publish and release Central deployment
        run: ./gradlew --no-daemon :usbHostForAndroid:publishAndReleaseToMavenCentral
      - name: Build release files for provenance
        run: ./gradlew --no-daemon :usbHostForAndroid:assembleRelease :usbHostExample:assembleRelease
      - name: Attest AAR provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: usbHostForAndroid/build/outputs/aar/*.aar
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            usbHostForAndroid/build/outputs/aar/*.aar \
            usbHostExample/build/outputs/apk/release/*.apk --clobber
