name: Android runner image

on:
  push:
    branches: [main, dev]
    paths:
      - docker/android-runner/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish GHCR image
        uses: docker/build-push-action@v7
        with:
          context: docker/android-runner
          push: true
          tags: |
            ghcr.io/mkopa/usb-host-android-runner:latest
            ghcr.io/mkopa/usb-host-android-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log in to optional Docker Hub mirror
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Mirror immutable image to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          docker buildx imagetools create \
            --tag "${DOCKERHUB_USERNAME}/usb-host-android-runner:latest" \
            --tag "${DOCKERHUB_USERNAME}/usb-host-android-runner:${GITHUB_SHA}" \
            "ghcr.io/mkopa/usb-host-android-runner:${GITHUB_SHA}"
