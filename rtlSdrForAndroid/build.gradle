plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'info.marcin.usbhost.example.rtlsdr'
    compileSdk 37

    defaultConfig {
        applicationId 'info.marcin.usbhost.example.rtlsdr'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName providers.gradleProperty('VERSION_NAME').get()

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fvisibility=hidden'
                arguments '-DANDROID_STL=none'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation project(':usbHostForAndroid')

    def composeBom = platform("androidx.compose:compose-bom:${providers.gradleProperty('COMPOSE_BOM_VERSION').get()}")
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
