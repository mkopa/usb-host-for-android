plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'info.marcin.usbhost'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 23
        targetSdk 35
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cFlags '-Wall', '-Wextra', '-Werror=return-type'
                cppFlags '-std=c++17', '-Wall', '-Wextra', '-Werror=return-type'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig false
        prefabPublishing true
    }

    prefab {
        usbhost {
            headers 'src/main/cpp/include'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

mavenPublishing {
    coordinates(
            providers.gradleProperty('GROUP').get(),
            providers.gradleProperty('POM_ARTIFACT_ID').get(),
            providers.gradleProperty('VERSION_NAME').get())

    publishToMavenCentral(true)

    if (providers.environmentVariable('ORG_GRADLE_PROJECT_signingInMemoryKey').isPresent()
            || providers.gradleProperty('signingInMemoryKey').isPresent()) {
        signAllPublications()
    }

    pom {
        name = providers.gradleProperty('POM_NAME').get()
        description = providers.gradleProperty('POM_DESCRIPTION').get()
        inceptionYear = providers.gradleProperty('POM_INCEPTION_YEAR').get()
        url = providers.gradleProperty('POM_URL').get()
        licenses {
            license {
                name = providers.gradleProperty('POM_LICENSE_NAME').get()
                url = providers.gradleProperty('POM_LICENSE_URL').get()
                distribution = providers.gradleProperty('POM_LICENSE_DIST').get()
            }
        }
        developers {
            developer {
                id = providers.gradleProperty('POM_DEVELOPER_ID').get()
                name = providers.gradleProperty('POM_DEVELOPER_NAME').get()
                url = providers.gradleProperty('POM_DEVELOPER_URL').get()
            }
        }
        scm {
            url = providers.gradleProperty('POM_SCM_URL').get()
            connection = providers.gradleProperty('POM_SCM_CONNECTION').get()
            developerConnection = providers.gradleProperty('POM_SCM_DEV_CONNECTION').get()
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'ReleaseCandidate'
            url = layout.buildDirectory.dir('repository')
        }
    }
}

tasks.register('verifyReleasePublication') {
    group = 'verification'
    description = 'Verifies local 0.1.0 Maven metadata, AAR contents, and namespace linkage.'
    dependsOn 'publishAllPublicationsToReleaseCandidateRepository'

    doLast {
        def groupPath = providers.gradleProperty('GROUP').get().replace('.', '/')
        def artifact = providers.gradleProperty('POM_ARTIFACT_ID').get()
        def version = providers.gradleProperty('VERSION_NAME').get()
        if (version.endsWith('-SNAPSHOT')) {
            throw new GradleException('Release publication cannot use a snapshot version')
        }

        def releaseDir = layout.buildDirectory.dir(
                "repository/${groupPath}/${artifact}/${version}").get().asFile
        def aar = new File(releaseDir, "${artifact}-${version}.aar")
        def pom = new File(releaseDir, "${artifact}-${version}.pom")
        def sources = new File(releaseDir, "${artifact}-${version}-sources.jar")
        def javadoc = new File(releaseDir, "${artifact}-${version}-javadoc.jar")
        [aar, pom, sources, javadoc].each { required ->
            if (!required.isFile() || required.length() == 0L) {
                throw new GradleException("Missing or empty publication artifact: ${required}")
            }
        }

        def pomText = pom.getText('UTF-8')
        ['<groupId>info.marcin.usbhost</groupId>', '<artifactId>usb-host-for-android</artifactId>',
         '<version>0.1.0</version>', '<name>USB Host for Android</name>'].each { required ->
            if (!pomText.contains(required)) {
                throw new GradleException("POM contract is missing: ${required}")
            }
        }

        copy {
            from zipTree(aar)
            into layout.buildDirectory.dir('verified-aar')
        }
        def classesJar = layout.buildDirectory.file('verified-aar/classes.jar').get().asFile
        if (!classesJar.isFile()) {
            throw new GradleException('AAR does not contain classes.jar')
        }
        def classEntries = zipTree(classesJar).files.collect {
            it.path.replace('\\', '/')
        }.join('\n')
        def previousApi = file('src/test/resources/public-managed-api-baseline.txt')
                .readLines('UTF-8')
                .findAll { it ==~ /^(class|enum) .+$/ }
                .collect { it.split(' ', 2)[1].replace('.', '/') + '.class' }
        def transportApi = [
            'info/marcin/usbhost/transport/GenericUsbDevice.class',
            'info/marcin/usbhost/transport/GenericUsbInterface.class',
            'info/marcin/usbhost/transport/GenericUsbDeviceDescriptor.class',
            'info/marcin/usbhost/transport/GenericUsbConfiguration.class',
            'info/marcin/usbhost/transport/GenericUsbAlternateSetting.class',
            'info/marcin/usbhost/transport/GenericUsbInterfaceDescriptor.class',
            'info/marcin/usbhost/transport/GenericUsbEndpoint.class',
            'info/marcin/usbhost/transport/AdditionalUsbDescriptor.class',
            'info/marcin/usbhost/transport/UsbControlRequest.class',
            'info/marcin/usbhost/transport/UsbDirection.class',
            'info/marcin/usbhost/transport/UsbTransferResult.class',
            'info/marcin/usbhost/transport/UsbTransferType.class',
            'info/marcin/usbhost/transport/UsbTransportStatus.class',
            'info/marcin/usbhost/transport/UsbTransportException.class'
        ]
        (previousApi + transportApi).each { requiredClass ->
            if (!classEntries.contains(requiredClass)) {
                throw new GradleException(
                        "Required published API is absent from classes.jar: ${requiredClass}")
            }
        }

        def sourceEntries = zipTree(sources).files.collect {
            it.path.replace('\\', '/')
        }.join('\n')
        def documentedSources = (previousApi + transportApi).collect {
            it.replace('.class', '.java')
        }
        documentedSources.each { requiredSource ->
            if (!sourceEntries.contains(requiredSource)) {
                throw new GradleException(
                        "Published source is absent from sources.jar: ${requiredSource}")
            }
        }
        ['info/marcin/usbhost/StlinkSession.java',
         'info/marcin/usbhost/transport/GenericUsbDevice.java'].each { documentedSource ->
            def sourceFile = zipTree(sources).matching { include "**/${documentedSource}" }.singleFile
            if (!sourceFile.getText('UTF-8').contains('/**')) {
                throw new GradleException("Published source lacks API documentation: ${documentedSource}")
            }
        }

        def javadocEntries = zipTree(javadoc).files.collect {
            it.path.replace('\\', '/')
        }.join('\n')
        documentedSources.each { requiredSource ->
            def requiredDoc = requiredSource.replace('.java', '.html')
            if (!javadocEntries.contains(requiredDoc)) {
                throw new GradleException(
                        "Published Javadoc is absent: ${requiredDoc}")
            }
        }

        ['usbhost.h', 'transport.h'].each { header ->
            def publishedHeader = layout.buildDirectory.file(
                    "verified-aar/prefab/modules/usbhost/include/usbhost/${header}").get().asFile
            def sourceHeader = file("src/main/cpp/include/usbhost/${header}")
            if (!publishedHeader.isFile()
                    || !java.util.Arrays.equals(publishedHeader.bytes, sourceHeader.bytes)) {
                throw new GradleException("Prefab header is missing or stale: usbhost/${header}")
            }
        }
        ['arm64-v8a', 'armeabi-v7a', 'x86_64'].each { abi ->
            def nativeLibrary = layout.buildDirectory.file(
                    "verified-aar/jni/${abi}/libusbhost.so").get().asFile
            if (!nativeLibrary.isFile() || nativeLibrary.length() == 0L) {
                throw new GradleException("Published AAR is missing JNI library for ${abi}")
            }
            def prefabLibrary = layout.buildDirectory.file(
                    "verified-aar/prefab/modules/usbhost/libs/android.${abi}/libusbhost.so")
                    .get().asFile
            if (!prefabLibrary.isFile() || prefabLibrary.length() == 0L) {
                throw new GradleException("Prefab library is missing for ${abi}")
            }
        }
        if (classEntries.contains('dev/usbhost/android/')) {
            throw new GradleException('Previous development namespace remains in classes.jar')
        }
    }
}
