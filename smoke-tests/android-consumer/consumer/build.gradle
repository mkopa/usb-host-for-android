plugins {
    id 'com.android.library'
}

android {
    namespace 'info.marcin.usbhost.consumer.smoke'
    compileSdk 35

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'info.marcin.usbhost:usb-host-for-android:0.1.0'
    // Test-only: verifies the detached published-API consumer with the project's existing JUnit 4.
    testImplementation 'junit:junit:4.13.2'
}
